[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "stock-prediction"
version = "0.1.0"
description = "Stock prediction agent - fetch historical data, analyze technicals, and predict trends"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.31",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "tabulate>=0.9.0",
    "mcp[cli]>=1.2.0",
]

[project.scripts]
stock-predict = "stock_prediction.cli:main"

[tool.setuptools.packages.find]
include = ["stock_prediction*"]
